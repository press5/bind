---
# file: tests/tasks/apparmor.yml
#
# test apparmor tasks.
#

- name: apparmor | test if /etc/apparmor.d/usr.sbin.named file is present?
  ansible.builtin.shell: test -e /etc/apparmor.d/usr.sbin.named
  changed_when: false

- name: apparmor | ensure cache directory is present in the apparmor configuration
  ansible.builtin.shell: "grep '^  {{ item }},$' /etc/apparmor.d/usr.sbin.named"
  loop:
    - "{{ bind_dir_cache }}/** lrw"
    - "{{ bind_dir_cache }}/ rw"
  changed_when: false

- name: apparmor | ensure log directory is present in the apparmor configuration
  ansible.builtin.shell: "grep '^  {{ item }},$' /etc/apparmor.d/usr.sbin.named"
  loop:
    - "{{ bind_dir_log }}/** rw"
    - "{{ bind_dir_log }}/ rw"
  changed_when: false
