---
# file: bind/tests/tasks
#
# Test tasks to verify role execution.
#

- ansible.builtin.include_tasks: installation.yml
  tags: installation

- ansible.builtin.include_tasks: configuration.yml
  tags: configuration

- name: test syntax of configuration files
  ansible.builtin.shell: named-checkconf -z
  changed_when: false
  tags: configuration

- name: test syntax of example.com configuration file
  ansible.builtin.shell: named-checkzone -i full example.com /var/cache/bind/db.example.com.zone
  changed_when: false
  tags: configuration

- name: test if bind9 process is running
  ansible.builtin.shell: systemctl is-active bind9
  become: true
  register: test
  changed_when: false
  failed_when: test.stdout != 'active'
