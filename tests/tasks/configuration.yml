---
# file: tests/tasks/configuration.yml
#
# test configuration tasks.
#

- name: configuration | test if /etc/default/bind9 file is present?
  ansible.builtin.shell: test -e /etc/default/bind9
  changed_when: false

- name: configuration | test if /etc/default/bind9 contains content?
  ansible.builtin.shell: grep '^RESOLVCONF=no$' /etc/default/bind9
  changed_when: false

- name: configuration | test if /etc/default/bind9 contains line?
  ansible.builtin.shell: "grep '^OPTIONS=\"{{ bind_default_options }}\"$' /etc/default/bind9"
  changed_when: false

- name: configuration | test if /etc/bind/named.conf.* files are present?
  ansible.builtin.shell: "test -e /etc/bind/named.conf{{ item }}"
  changed_when: false
  loop:
    - ''
    - '.acl'
    - '.controls'
    - '.keys'
    - '.local'
    - '.logging'
    - '.options'

- name: configuration | copy bind configuration test resources
  ansible.builtin.copy:
    src: "tmp/named.conf{{ item }}.expected"
    dest: "/tmp/named.conf{{ item }}.expected"
  become: true
  changed_when: false
  loop:
    - ''
    - '.acl'
    - '.controls'
    - '.keys'
    - '.local'
    - '.logging'
    - '.options'

- name: configuration | test named.conf template generation
  ansible.builtin.shell: "diff -w /etc/bind/named.conf{{ item }} /tmp/named.conf{{ item }}.expected"
  changed_when: false
  loop:
    - ''
    - '.acl'
    - '.controls'
    - '.keys'
    - '.local'
    - '.logging'
    - '.options'

- name: configuration | test if /var/cache/bind/db.example.com.zone exists
  ansible.builtin.shell: "test -e {{ bind_dir_cache }}/db.{{ item }}.zone"
  changed_when: false
  loop:
    - 'example.com'

- name: configuration | copy zone database test resources
  ansible.builtin.copy:
    src: "tmp/db.{{ item }}.zone.expected"
    dest: "/tmp/db.{{ item }}.zone.expected"
  become: true
  changed_when: false
  loop:
    - 'example.com'

- name: configuration | test bind zone database file generation
  ansible.builtin.shell: "diff -w {{ bind_dir_cache }}/db.{{ item }}.zone /tmp/db.{{ item }}.zone.expected"
  changed_when: false
  loop:
    - 'example.com'
