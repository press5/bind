---
# file: bind/handlers/main.yml
#
# handlers file
#

- name: reload bind9
  ansible.builtin.service:
    name: bind9
    state: reloaded
  become: true

- name: restart bind9
  ansible.builtin.service:
    name: bind9
    state: restarted
  become: true

- name: start bind9
  ansible.builtin.service:
    name: bind9
    state: started
  become: true

- name: stop bind9
  ansible.builtin.service:
    name: bind9
    state: stopped
  become: true
